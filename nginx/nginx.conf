server {
    listen 80;
    server_name api.9su.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.9su.site;

    ssl_certificate /etc/letsencrypt/live/api.9su.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.9su.site/privkey.pem;

    location / {
        proxy_pass http://sinsal-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}