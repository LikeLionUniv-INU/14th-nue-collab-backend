services:
  sinsal-api:
    image: 242777378795.dkr.ecr.ap-northeast-2.amazonaws.com/sinsal-api:latest
    container_name: sinsal-api
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - sinsal-api
    networks:
      - app-network
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - sinsal-api
    networks:
      - app-network

  grafana:
      image: grafana/grafana:latest
      container_name: grafana
      restart: unless-stopped
      ports:
        - "3000:3000"
      depends_on:
        - prometheus
      networks:
        - app-network


networks:
  app-network:
    driver: bridge